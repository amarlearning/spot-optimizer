[project]
name = "spot-optimizer"
version = "1.3.1"
description = "AWS EC2 spot instance optimizer"
authors = [{ name = "Amar Prakash", email = "amar.om1994@gmail.com" }]
readme = "README.md"
keywords = ["aws", "ec2", "spot", "optimizer"]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "requests>=2.32.3,<3",
    "diskcache>=5.6.3,<6",
    "appdirs>=1.4.4,<2",
    "duckdb>=1.1.3,<2",
    "pandas>=2.2.0,<3",
    "boto3>=1.34.0,<2",
    "urllib3<2.0.0",  # Required for boto3 compatibility
    "tqdm>=4.66.1,<5",  # For progress bars
]

[project.urls]
Repository = "https://github.com/amarlearning/spot-optimizer"

[project.scripts]
spot-optimizer = "spot_optimizer.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.4,<9",
    "pytest-cov>=4.1.0,<5",
    "pytest-timeout>=2.3.1,<3",  # For test timeout handling
    "pytest-xdist>=3.6.0,<4",  # For parallel test execution
    "psutil>=6.1.0,<7",  # For memory monitoring in performance tests
    "safety>=3.2.7,<4",  # For security scanning
    "bandit>=1.7.5,<2",  # For security linting
]
types = [
    "types-requests>=2.31.0,<3",
]

[tool.uv]
default-groups = "all"  # Match Poetry: install every group by default

[tool.uv.build-backend]
module-root = ""  # Flat layout: spot_optimizer/ at the repo root

[build-system]
requires = ["uv_build>=0.10.2,<0.11"]
build-backend = "uv_build"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "performance: marks tests as performance tests",
    "network: marks tests that require network access",
]
timeout = 300  # 5 minute default timeout for tests
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["spot_optimizer"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/conftest.py",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/scripts/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
skip_covered = false
precision = 2

[tool.coverage.html]
directory = "htmlcov"

[tool.bandit]
exclude_dirs = ["tests", "scripts"]
skips = ["B101", "B601"]  # Skip assert_used and shell_injection_process_args

[tool.bandit.assert_used]
skips = ["*_test.py", "*/test_*.py"]
